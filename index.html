<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="indexStyle.css">
    <link rel="icon" href="img/logo.svg">
    <script defer src="index.js"></script>
    <title>Jogo da Memória — escolha seu nível</title>
    <meta name="description" content="Treine sua memória com cartas de baralho. Escolha entre três níveis e tente superar seu recorde.">
  </head>
  <body>
    <div class="header">

      <!--Content before waves-->
        <main class="inner-header">
          <!--Just the logo.. Don't mind this-->
          <div class="titulo flex">
            <img class="logo" src="img/logo.svg" alt="">
            <h1>Jogo da Memória</h1>
          </div>
          <div class="entrada">
            <div id="formContent">
              <!-- ANCHOR - Login Form -->
              <form action="game.html" method="get" class="resultadoForm">
                <div class="form-control">
                  <label for="player-name">Nome do jogador</label>
                  <input id="player-name" name="nome" type="text" required maxlength="20" autocomplete="nickname" class="myInput" aria-describedby="name-help">
                  <small id="name-help">Até 20 caracteres.</small>
                </div>
                <label for="level">Nível</label>
                <select id="level" name="nivel">
                  <option value="facil">Fácil — 6 pares</option>
                  <option value="medio">Médio — 10 pares</option>
                  <option value="dificil">Difícil — 15 pares</option>
                </select>
                <p id="form-error" role="alert"></p>
                <button type="submit" class="login_button">Jogar</button>
                <section class="records" aria-labelledby="records-title">
                  <h2 id="records-title">Seus recordes</h2>
                  <p id="record-facil"></p><p id="record-medio"></p><p id="record-dificil"></p>
                </section>
              </form>

            </div>
            <div class="entrada hidden"></div>
          </div>
        </main>

      <!--Waves Container-->
      <div>
        <svg aria-hidden="true" class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
          <defs>
            <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
          </defs>
          <g class="parallax">
            <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
            <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
            <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
            <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
          </g>
        </svg>
      </div>
      <!--Waves end-->

    </div>
    <!--Header ends-->

    <!--Content starts-->
    <footer>
      <div class="content">
        <p><a href="https://github.com/KAYOKG" target="_blank"><img class="github" src="img/github.svg" alt="GitHub do autor"></a>
        </p>
      </div>
    </footer>

  </body>
</html>
